services:
  backend:
    build: .
    ports:
      - "5000:5000"
    # Secrets (JWT_SECRET, PHONEPE_*, ADMIN_*, FRONTEND_URL, etc.) come from .env
    env_file:
      - .env
    # These override whatever is in .env so the app talks to the compose services
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/foodincar?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 5000
      # Rotating access.log + app.log on the host (see config/logger.js).
      # Remove this to keep logs in `docker compose logs` only.
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    # Container stdout is still the primary log — cap it so it can't fill the disk.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodincar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

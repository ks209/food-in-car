version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodincar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2
    container_name: redis_server
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/foodincar
      # Never hard-code this: the backend refuses to start in production with a
      # known/example value. Put a long random string in .env (see config/secrets.js).
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    # Cap container log size so it cannot fill the disk (see backend/config/logger.js
    # for optional rotating files on disk via LOG_DIR).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - db
      - redis

  # SaaS admin panel — manage restaurants
  admin:
    build: ./admin
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Restaurant management dashboard
  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    depends_on:
      - backend

  # Customer mobile-first ordering app
  mobile:
    build: ./mobile
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  pgdata:
